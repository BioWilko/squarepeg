name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[dev]"
      - run: pytest --cov

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ".[dev]"
      - run: ruff check .

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: helm/kind-action@v1
        with:
          cluster_name: kind
      - run: pip install ".[dev]"
      # single-platform archive rather than `kind load docker-image`: with docker's containerd image store
      # the export keeps the full multi-arch index but only the pulled platform's blobs, so kind's
      # `ctr import --all-platforms` fails with "content digest ...: not found"
      - run: |
          docker pull --platform linux/amd64 busybox:1.36
          docker save --platform linux/amd64 busybox:1.36 -o "$RUNNER_TEMP/busybox.tar"
          kind load image-archive "$RUNNER_TEMP/busybox.tar" --name kind
      - run: SQUAREPEG_INTEGRATION=1 pytest -m integration
        timeout-minutes: 5
